<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slowpoke</title>
<style>
  :root { --bg:#0b0d10; --fg:#e8e6e1; --dim:#7a7f87; --keep:#3ddc84; --rev:#ff5c5c; --line:#4da3ff; --grid:#1c2026; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; padding:24px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; }
  h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:.02em; }
  h1 span { color:var(--dim); font-weight:400; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px; }
  .stat { background:#11141a; border:1px solid var(--grid); border-radius:8px; padding:14px 18px; }
  .stat .k { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  .stat .v { font-size:40px; font-weight:600; margin-top:4px; }
  .stat .v small { font-size:18px; color:var(--dim); }
  #chart { width:100%; height:360px; background:#11141a; border:1px solid var(--grid); border-radius:8px; }
  #log { margin-top:16px; max-height:260px; overflow:auto; font-size:14px; }
  #log div { padding:4px 0; border-bottom:1px solid var(--grid); display:flex; gap:12px; }
  #log .n { color:var(--dim); width:42px; flex:none; }
  #log .s { width:80px; flex:none; }
  .keep { color:var(--keep); } .rev { color:var(--rev); }
</style>
</head>
<body>
<header><h1>Slowpoke <span>autoresearch · EV battery vs the grid · annual profit</span></h1><div id="clock" style="color:var(--dim)"></div></header>
<div class="stats">
  <div class="stat"><div class="k">Baseline (£/yr)</div><div class="v" id="base">–</div></div>
  <div class="stat"><div class="k">Best (£/yr)</div><div class="v" id="best">–</div></div>
  <div class="stat"><div class="k">Found by the loop</div><div class="v" id="imp">–</div></div>
  <div class="stat"><div class="k">Experiments</div><div class="v" id="n">–</div></div>
</div>
<svg id="chart" viewBox="0 0 1000 360" preserveAspectRatio="none"></svg>
<div id="log"></div>
<script>
const PATH = "../database/results.tsv";
async function tick() {
  let txt; try { txt = await (await fetch(PATH + "?t=" + Date.now())).text(); } catch { return; }
  const rows = txt.trim().split("\n").slice(1).map(l => { const c = l.split("\t");
    return { n:+c[0], score:+c[2], best:+c[3], kept:c[4]==="1", hyp:c[5] }; });
  if (!rows.length) return;
  const base = rows[0].best, best = rows[rows.length-1].best;
  const kept = rows.filter(r=>r.kept).length - 1;
  document.getElementById("base").textContent = (-base).toFixed(0);
  document.getElementById("best").textContent = (-best).toFixed(0);
  document.getElementById("imp").innerHTML = "+£" + (base-best).toFixed(0) + "<small>/yr</small>";
  document.getElementById("n").innerHTML = (rows.length-1) + `<small> · ${kept} kept</small>`;
  draw(rows); logit(rows);
}
function draw(rows) {
  const svg = document.getElementById("chart"); const W=1000,H=360,P={l:60,r:20,t:20,b:36};
  const valid = rows.filter(r=>r.score<1e5);
  const ys = valid.map(r=>r.score).concat(rows.map(r=>r.best));
  const ymin = Math.min(...ys)*0.97, ymax = Math.max(...ys)*1.03;
  const X = n => P.l + (n/(Math.max(rows.length-1,1)))*(W-P.l-P.r);
  const Y = v => P.t + (1-(v-ymin)/(ymax-ymin))*(H-P.t-P.b);
  let s = "";
  for (let i=0;i<5;i++){ const v=ymin+(ymax-ymin)*i/4, y=Y(v);
    s += `<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="#1c2026"/><text x="${P.l-8}" y="${y+4}" fill="#7a7f87" font-size="12" text-anchor="end">${v.toFixed(2)}</text>`; }
  s += `<polyline fill="none" stroke="#4da3ff" stroke-width="2.5" points="${rows.map(r=>`${X(r.n)},${Y(r.best)}`).join(" ")}"/>`;
  for (const r of valid) s += `<circle cx="${X(r.n)}" cy="${Y(r.score)}" r="5" fill="${r.kept?"#3ddc84":"#ff5c5c"}" opacity=".9"/>`;
  s += `<text x="${W/2}" y="${H-8}" fill="#7a7f87" font-size="12" text-anchor="middle">experiment</text>`;
  svg.innerHTML = s;
}
function logit(rows) {
  document.getElementById("log").innerHTML = rows.slice().reverse().map(r =>
    `<div><span class="n">#${r.n}</span><span class="s ${r.kept?"keep":"rev"}">${r.score<1e5?r.score.toFixed(4):"FAIL"}</span><span>${r.hyp}</span></div>`).join("");
}
setInterval(()=>document.getElementById("clock").textContent=new Date().toLocaleTimeString(),1000);
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
